<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>라면을 끓이는 순서</title>
  </head>
  <body>
    <h3>라면을 끓이는 순서</h3>
    <hr />
    <ol type="A" style="background-color: yellowgreen" id="makeRamen">
      <li>물을 끓인다.</li>
    </ol>
    <script>
      let ol = document.getElementById("makeRamen");
      ol.onclick = function () {
        text = this.innerHTML;
        add = prompt(
          "라면을 끓이는 순서를 입력하라.",
          "봉지에서 라면을 미리 꺼내 놓는다.",
        );
        this.innerHTML = text + "<li>" + add + "</li>";
      };
    </script>
  </body>
</html>
