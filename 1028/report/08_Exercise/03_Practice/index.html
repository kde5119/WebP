<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>visibility 프로퍼티</title>
  </head>
  <style>
    span {
      visibility: hidden;
    }
  </style>
  <body>
    <h3>
      다음 빈 곳에 숨은 단어?
      <button onclick="spanVisible()">show/hide</button>
    </h3>
    <hr />
    <ul>
      <li>I (<span>love</span>) you.</li>
      <li>CSS is Cascading (<span>Style</span>) Sheet.</li>
      <li>응답하라 (<span>1988</span>).</li>
    </ul>
    <script>
      let ishide = true;
      function spanVisible() {
        let spans = document.getElementsByTagName("span");
        for (let span of spans) {
          span.style.visibility = ishide ? "visible" : "hidden";
          span.style.color = "blue";
        }
        ishide = !ishide;
      }
    </script>
  </body>
</html>
