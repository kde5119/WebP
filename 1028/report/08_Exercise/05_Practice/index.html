<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>z-index 스타일 프로퍼티</title>
    <style>
      div {
        position: absolute;
      }
      img {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <h3>z-index 스타일 프로퍼티</h3>
    <hr />
    <div>
      <img
        src="spade-A.png"
        alt="스페이드A"
        width="100"
        height="140"
        onclick="zindeximg(this)"
      />
      <img
        src="spade-2.png"
        alt="스페이드2"
        width="100"
        height="140"
        onclick="zindeximg(this)"
      />
      <img
        src="spade-3.png"
        alt="스페이드3"
        width="100"
        height="140"
        onclick="zindeximg(this)"
      />
      <img
        src="spade-7.png"
        alt="스페이드7"
        width="100"
        height="140"
        onclick="zindeximg(this)"
      />
    </div>
    <script>
      let count = 0;
      let imgs = document.getElementsByTagName("img");
      function zindeximg(img) {
        img.style.zIndex = -1;
        count++;
        if (count == 4) {
          let idx = 0;
          for (let i of imgs) {
            i.style.zIndex = idx;
            idx++;
          }
          count = 0;
        }
      }
    </script>
  </body>
</html>
