<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>별 문자 출력하는 프로그램</title>
  </head>
  <body>
    <h3>별 문자 출력하기</h3>
    <hr />
    <script>
      function star(n) {
        for (let i = 0; i < n; i++) {
          for (let j = 0; j <= i; j++) {
            document.write("*");
          }
          document.write("<br>");
        }
      }
      let input = prompt("정수를 입력하세요", 7);
      let inputN = parseInt(input);
      if (!isNaN(inputN) && input == inputN && inputN > 0) {
        star(inputN);
      } else {
        document.write("입력 오류 입니다.");
      }
    </script>
  </body>
</html>
