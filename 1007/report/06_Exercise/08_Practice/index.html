<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eval()로 수식 계산</title>
  </head>
  <body>
    <h3>eval()로 수식 계산</h3>
    <hr />
    <script>
      let calc = prompt("수식 입력", "2+12*8-20/7");
      let result = eval(calc);
      document.write(calc + " = " + result);
    </script>
  </body>
</html>
