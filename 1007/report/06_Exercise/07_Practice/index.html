<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>큰 자리수와 낮은자리수 같은지 비교</title>
  </head>
  <body>
    <h3>큰 자리수와 낮은자리수 같은지 비교</h3>
    <hr />
    <script>
      let n = prompt("숫자 입력", "5678");
      let m = parseInt(n);
      let lastIdx = m % 10;

      while (m >= 10) {
        m = Math.floor(m / 10);
      }

      if (m == lastIdx) {
        document.write(n + ": 같음");
      } else {
        document.write(n + ": 다름");
      }
    </script>
  </body>
</html>
