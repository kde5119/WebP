<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>윤년 판별 결과</h1>
    <!-- 결과를 출력할 빈 태그 -->
    <div id="result"></div>

    <script>
        // 1. prompt 창으로 연도 입력받기
        const userInput = prompt("연도를 입력하세요:", "2026");
        const year = parseInt(userInput);
        const resultDiv = document.getElementById("result");

        // 2. 유효성 검사 (숫자가 맞는지 확인)
        if (isNaN(year)) {
            resultDiv.innerText = "올바른 숫자를 입력해주세요.";
        } else {
            // 3. 윤년 판별 공식
            // 4로 나누어 떨어지고 100으로 안 떨어지거나, 400으로 나누어 떨어지면 윤년
            const isLeapYear = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);

            // 4. 결과 출력
            if (isLeapYear) {
                resultDiv.innerText = year + "년은 윤년입니다.";
            } else {
                resultDiv.innerText = year + "년은 평년입니다.";
            }
        }
    </script>

</body>
    
</html>
