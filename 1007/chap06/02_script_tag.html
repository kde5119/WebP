<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>script 태그에 자바스크립트 코드</title>
    <script>
        function over(obj) {
            obj.src="Attached_File/바나나.jpg";
        }
        function out(obj) {
            obj.src="Attached_File/사과.jpg";
        }
    </script>
</head>
<body>
    <h3>마우스 올려 보세요</h3>
    <hr>
    <img src="Attached_File/사과.jpg" alt="사과"
        onmouseover="over(this)"
        onmouseout="out(this)">
</body>
</html>
