<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>animation</title>
    <style>
      img {
        animation: rotate 1s linear infinite;
      }
      @keyframes rotate {
        0% {
          transform: rotate(-90deg);
        }
        50% {
          transform: rotate(90deg);
        }
        100% {
          transform: rotate(-90deg);
        }
      }
    </style>
  </head>
  <body>
    <h3>어지러워요</h3>
    <hr />
    <img src="스폰지밥.jpg" alt="스폰지밥" />
  </body>
</html>
