<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>애니메이션</title>
    <style>
      img {
        width: 15px;
      }
      p {
        font-size: 15px;
      }
      p {
        animation: ani 3s;
      }
      @keyframes ani {
        from {
          margin-left: 100%;
        }
        to {
          margin-left: 0%;
        }
      }
    </style>
  </head>
  <body>
    <h3>애니메이션 응용</h3>
    <hr />
    <p><img src="물음표.jpg" alt="물음표" /> 질문있습니다</p>
  </body>
</html>
