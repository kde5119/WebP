<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카푸치노 만들기</title>
    <style>
      span {
        color: green;
        font-size: 40px;
        margin-right: 10px;
      }
      div {
        border: 2px solid saddlebrown;
        padding: 10px;
      }
      table {
        width: 500px;
      }
      thead {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h3>카푸치노</h3>
    <hr />
    <div>
      <table>
        <thead>
          <tr>
            <th colspan="2"><h3>카푸치노 만드는 순서</h3></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span>1.</span></td>
            <td class="p">
              에스프레소를 추출한다.반드시 에스프레소 콩을 사용해야 제맛이 난다.
            </td>
          </tr>
          <tr>
            <td><span>2.</span></td>
            <td class="p">
              적당한 용기에 우유를 넣어 중탕을 하거나 끓기 직전까지 데운다.
            </td>
          </tr>
          <tr>
            <td><span>3.</span></td>
            <td class="p">
              몇초간 저어 충분히 거품을 낸다. 거품이 충분하지 않으면 풍미가
              떨어진다.
            </td>
          </tr>
          <tr>
            <td><span>4.</span></td>
            <td class="p">
              컵에 계피 막대를 꽂고 커피를 부은후 우유 거품을 붓는다. 휘핑크림을
              얹고 계피가루를 뿌린다.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
