<!-- 본문에 있는 그림 1-13의 test2.html을 수정하여 다음과 같이 <span> 태그에 둘러싸인 글자색을 violet으로 수정하고 <hr>태그에 의해 출력되는 수평선의 두께를 10px로 변경하라.
1. <span>의 color를 violet으로 수정
2. <hr>의 height를 10px로 변경
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>웹 페이지의 구성 요소</title>
    <style>
      body {
        background-color: linen;
        color: green;
        margin-left: 40px;
        margin-right: 40px;
      }
      h3 {
        text-align: center;
        color: darkred;
      }
      hr {
        height: 10px;
        border: solid grey;
        background-color: grey;
      }
      span {
        color: violet;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <h3>Elvis Presley</h3>
    <hr />
    He was an American singer and actor. In November 1956, he made his film
    debut in <span>Love Me Tender</span>. He is often referred to as "<span>
      the King of Rock and Roll </span
    >".
  </body>
</html>
