<!-- 다음 HTML5 페이지는 HTML 태그에 2개, CSS에 1개의 간단한 오류를 포함하고 있다. 오류를 수정하라. 
1. <body>를 <head>로 수정하기
2. h3 { text-align: center; color: darkred; }으로 ; 추가하기
3. </h>를 </h3>으로 수정하기
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>오류를 찾으세요</title>
    <style>
      h3 {
        text-align: center;
        color: darkred;
      }
      span {
        color: blue;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <h3>Elvis Presley</h3>
    <hr />
    He was an American singer and actor. In November 1956, he made his film
    debut in <span>Love Me Tender</span>. He is often referred to as "<span>
      the King of Rock and Roll </span
    >".
  </body>
</html>
