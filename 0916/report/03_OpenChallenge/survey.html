<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>설문지</title>
  </head>
  <body>
    <header>
      <h1>설문지</h1>
      <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
      <hr />
    </header>
    <section>
      <form method="post">
        <div>
          학년

          <label>
            <input type="radio" name="grade" value="1" />
            1학년
          </label>

          <label>
            <input type="radio" name="grade" value="2" />
            2학년
          </label>

          <label>
            <input type="radio" name="grade" value="3" />
            3학년
          </label>

          <label>
            <input type="radio" name="grade" value="4" />
            4학년
          </label>
        </div>
        <div>
          성별

          <label>
            <input type="radio" name="gender" value="man" />
            남
          </label>

          <label>
            <input type="radio" name="gender" value="woman" />
            여
          </label>
        </div>
        <div>
          관심분야

          <select name="Interest">
            <option value="1">모바일</option>
            <option value="2">윈도우</option>
            <option value="3">서버</option>
          </select>
        </div>
        <div>
          진로

          <label>
            <input type="checkbox" name="course" value="개발" />
            개발
          </label>

          <label>
            <input type="checkbox" name="course" value="기획" />
            기획
          </label>

          <label>
            <input type="checkbox" name="course" value="영업" />
            영업
          </label>

          <label>
            <input type="checkbox" name="course" value="창업" />
            창업
          </label>
        </div>
        <div>
          남기고 싶은 말 <br />

          <textarea name="comment" rows="10" cols="30" wrap="soft">
글을 남겨주세요
            </textarea
          >
        </div>
      </form>
    </section>
  </body>
</html>
